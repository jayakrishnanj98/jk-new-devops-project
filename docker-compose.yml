services:
  php:
    build:
      context: ./application
    container_name: php
    expose:
      - "9000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8081:80"
    volumes:
      - ./application:/var/www/html
      - ./application/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
